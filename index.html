<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9e3ec">
<title>A Little Universe for Sarah ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#5b3a49;--soft:#9b6f82;--rose:#c2587f;--rose-deep:#a24468;--blush:#fbe3ec;--gold:#c9a15b;--paper:#fffaf6;--serif:"Playfair Display",Georgia,serif;--hand:"Dancing Script","Segoe Script",cursive;--ui:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{min-height:100vh;display:flex;justify-content:center;padding:22px 12px 34px;font-family:var(--serif);color:var(--ink);overflow-x:hidden;background:radial-gradient(ellipse at 12% 10%,#fff 0,transparent 32%),radial-gradient(ellipse at 90% 85%,#f6cfe1 0,transparent 38%),linear-gradient(135deg,#fbe6ee,#fff7f1 50%,#ecdcf0);background-attachment:fixed}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.shell{position:relative;z-index:1;width:min(900px,100%);text-align:center}
.eyebrow{margin:0;font:700 10px var(--ui);letter-spacing:3px;text-transform:uppercase;color:var(--soft)}
.heading{margin:6px 0;font:italic 700 clamp(34px,6vw,54px) var(--serif);color:var(--rose-deep);text-shadow:0 2px 0 #fff}
.sub{margin:0 0 16px;font:600 13px var(--ui);color:var(--soft)}
.toolbar,.controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border:1px solid #e4b3c6;border-radius:999px;background:#fffafc;color:var(--rose-deep);font:700 12px var(--ui);cursor:pointer;box-shadow:0 4px 12px rgba(160,70,110,.1);transition:transform .18s,box-shadow .18s,background .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(160,70,110,.18)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}.btn.primary{background:linear-gradient(135deg,#d9769a,var(--rose));border-color:transparent;color:#fff}.btn.small{padding:7px 11px;font-size:10px}
.status{min-height:18px;margin:10px 0 14px;font:600 11px var(--ui);color:var(--soft)}
.music-card{position:fixed;right:12px;bottom:12px;z-index:20;width:min(300px,calc(100vw - 24px));padding:10px;border:1px solid #ecc3d3;border-radius:16px;background:rgba(255,250,252,.98);box-shadow:0 10px 30px rgba(150,70,105,.25);display:none;text-align:left}
.music-card.show{display:block}.music-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 12px var(--ui);color:var(--rose-deep)}.music-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{flex:none;width:26px;height:26px;border:0;border-radius:50%;background:var(--blush);color:var(--rose-deep);font-size:16px;cursor:pointer}
.music-card audio{display:block;width:100%;height:38px;margin:8px 0;accent-color:var(--rose)}.song-actions{display:flex;gap:6px}
.book-area{position:relative;width:min(700px,100%);height:clamp(470px,74vh,560px);margin:0 auto;perspective:2200px;touch-action:pan-y}
.book{position:absolute;inset:0;transform-style:preserve-3d}
.back-cover{position:absolute;inset:0;border-radius:8px 18px 18px 8px;background:linear-gradient(110deg,#a24468,#d98aa9 50%,#b2557a);box-shadow:0 26px 40px -14px rgba(120,50,85,.45),inset 8px 0 14px rgba(90,30,60,.3)}
.page{position:absolute;inset:0;cursor:pointer;transform-origin:left center;transform-style:preserve-3d;border-radius:6px 16px 16px 6px;transition:transform .95s cubic-bezier(.45,.05,.25,1),opacity 0s}
.page.is-active,.page.flipped{will-change:transform}.page.flipped{transform:rotateY(-180deg);opacity:0;pointer-events:none;transition:transform .95s cubic-bezier(.45,.05,.25,1),opacity .2s linear .75s}.page.far{visibility:hidden}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;border-radius:6px 16px 16px 6px;border:1px solid #efd9de;background:linear-gradient(135deg,#fffdfa,#fff6f2);box-shadow:inset 10px 0 16px rgba(150,90,110,.08);text-align:left}
.face:before{content:"";position:absolute;inset:9px;border:1px solid #f1d5df;border-radius:4px 12px 12px 4px;pointer-events:none}
.face.back{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fffaf7,#fff0f5);font-size:34px;color:#e6b3c8;box-shadow:inset -10px 0 16px rgba(150,90,110,.08)}
.inner{position:absolute;inset:0;padding:clamp(20px,4.5vw,38px) clamp(18px,4.5vw,38px) 60px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#e8bccd transparent}
.face.cover{display:flex;align-items:center;justify-content:center;text-align:center;border:0;color:#fff;background:radial-gradient(ellipse at 30% 20%,#e99bb8,transparent 60%),linear-gradient(135deg,#c2587f,#8f3a5e)}
.face.cover:before{inset:14px;border:2px solid var(--gold);border-radius:4px 12px 12px 4px;opacity:.85}
.cover-top,.cover-bottom{position:absolute;left:0;right:0;text-align:center;color:#f6dca6}.cover-top{top:32px;font-size:17px;letter-spacing:6px}.cover-bottom{bottom:32px;font:italic 500 14px var(--serif)}
.cover-small{font:700 10px var(--ui);letter-spacing:3px;text-transform:uppercase;color:#f9dfe9}.cover-title{margin:10px 0;font:italic 700 clamp(44px,9vw,70px)/1.05 var(--serif);color:#fff3d6;text-shadow:0 2px 0 #a8793a,0 8px 22px rgba(60,10,30,.4)}.cover-flower{margin-top:14px;font-size:30px}.cover-sticker{position:absolute;font-size:30px}.cover-sticker.l{left:30px;bottom:80px}.cover-sticker.r{right:30px;top:80px}
.label{display:inline-block;margin:0 0 8px;padding:3px 12px;border-radius:999px;background:var(--blush);color:var(--rose-deep);font:700 15px var(--hand)}
.title{margin:0 0 12px;padding-right:34px;font:italic 700 clamp(22px,3.6vw,31px)/1.15 var(--serif);color:var(--rose-deep)}
.text{margin:0;padding:12px 14px;max-width:560px;border:1px solid #f3dce5;border-radius:14px;background:rgba(255,255,255,.75);font:500 clamp(13px,1.8vw,15.5px)/1.6 var(--serif)}
.caption{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0;padding:7px 12px;border:1px dashed #e2b6c7;border-radius:12px;background:linear-gradient(100deg,#fff4f8,#fffaf0);font:600 11px var(--ui);color:var(--soft)}
.note{margin:12px 0 0;font:500 18px var(--hand);color:var(--rose)}.pagenum{display:block;margin-top:10px;text-align:center;font:700 9px var(--ui);letter-spacing:3px;color:#b78898}
.tape{position:absolute;top:4px;left:calc(50% - 26px);width:52px;height:14px;border-radius:3px;background:rgba(243,189,208,.7);transform:rotate(-4deg);pointer-events:none;z-index:2}
.doodle{position:absolute;top:18px;right:24px;font-size:24px;pointer-events:none;z-index:2}.sticker{position:absolute;right:22px;bottom:28px;font-size:30px;pointer-events:none;z-index:2}
.page.is-active .sticker{animation:bob 3.2s ease-in-out infinite}.page.is-active .doodle{animation:twinkle 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(5deg)}}@keyframes twinkle{50%{transform:scale(1.18) rotate(8deg);opacity:.7}}
.polaroid{display:block;width:150px;margin:14px auto 0;padding:7px 7px 4px;background:#fff;border-radius:3px;box-shadow:0 8px 18px rgba(130,60,90,.22);transform:rotate(-2.5deg);cursor:pointer;text-align:center;transition:transform .25s}
.polaroid:hover{transform:rotate(0) scale(1.03)}.polaroid .pic{position:relative;height:104px;border-radius:2px;overflow:hidden;background:linear-gradient(135deg,#fff1f6,#f6e2ee);display:flex;align-items:center;justify-content:center}.polaroid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.polaroid .ph{font:600 10px/1.5 var(--ui);color:#b17c8e}.polaroid small{display:block;padding-top:3px;font:500 14px var(--hand);color:var(--soft)}

/* Page 11 — Sarah's birthday keepsake */
.birthday-page{padding:clamp(18px,4vw,34px) clamp(16px,4vw,34px) 54px;text-align:center}
.birthday-page:before{border-color:#efc9d7}
.birthday-kicker{margin:2px 0 4px;font:700 9px var(--ui);letter-spacing:3px;text-transform:uppercase;color:#b88798}
.birthday-heading{margin:0;color:var(--rose-deep);font:700 clamp(31px,6vw,48px)/1.08 var(--hand);text-shadow:0 2px #fff}
.birthday-date{display:inline-block;margin:8px 0 13px;padding:5px 15px;border:1px solid #e9c4d2;border-radius:999px;background:#fff8f8;color:#a76d83;font:700 11px var(--ui);letter-spacing:1.2px}
.birthday-ornament{margin:0 0 9px;color:#d58ba7;font-size:17px;letter-spacing:8px}
.birthday-photo{position:relative;display:block;width:min(100%,470px);height:clamp(145px,27vh,205px);margin:0 auto 12px;padding:8px;border:1px solid #e7b8ca;border-radius:22px;background:linear-gradient(145deg,#fff,#fff3f7);box-shadow:0 9px 22px rgba(151,75,107,.15);cursor:pointer;transform:rotate(-.4deg)}
.birthday-photo:before{content:"";position:absolute;inset:4px;border:1px dashed #e9c3d1;border-radius:16px;pointer-events:none}
.birthday-photo-inner{position:relative;display:flex;width:100%;height:100%;align-items:center;justify-content:center;overflow:hidden;border-radius:15px;background:radial-gradient(circle at 20% 20%,#fff 0,transparent 40%),linear-gradient(135deg,#fbe7ef,#fff7f1 55%,#f4e5ee)}
.birthday-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.birthday-photo .ph{max-width:230px;padding:12px;color:#ae7a8d;font:600 13px/1.5 var(--ui)}
.birthday-photo .photo-sparkle{position:absolute;right:13px;top:9px;color:#cf8ba6;font-size:21px}
.birthday-message{max-width:470px;margin:0 auto;padding:12px 16px;border:1px solid #f0d9e1;border-radius:16px;background:rgba(255,255,255,.78);color:#765264;font:500 clamp(12px,1.7vw,14px)/1.55 var(--serif);text-align:center}
.birthday-message strong{display:block;margin-bottom:3px;color:var(--rose-deep);font:700 19px var(--hand)}
.birthday-bottom{margin:12px 0 0;color:#b16f89;font:500 20px var(--hand)}
.birthday-flower{position:absolute;font-size:22px;pointer-events:none;opacity:.9}
.birthday-flower.one{left:17px;top:19px;transform:rotate(-18deg)}
.birthday-flower.two{right:18px;bottom:21px;transform:rotate(14deg)}
@media(max-width:540px){.birthday-page{padding:18px 15px 48px}.birthday-date{margin:7px 0 10px}.birthday-photo{height:clamp(135px,25vh,175px);margin-bottom:10px}.birthday-message{padding:10px 12px}.birthday-bottom{font-size:18px}}
.progress{width:min(260px,70%);height:4px;margin:20px auto 12px;border-radius:4px;background:rgba(194,88,127,.15);overflow:hidden}.progress span{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#e08aab,var(--rose));transition:transform .5s ease}
.counter{min-width:110px;font:700 12px var(--ui);color:var(--soft)}.hint{margin:12px 0 0;font:600 11px var(--ui);color:var(--soft)}.footer{margin:8px 0 0;font:italic 500 13px var(--serif);color:#ad8795}
@media(max-width:540px){body{padding:14px 8px 26px}.btn{padding:9px 12px}.polaroid{width:132px}.polaroid .pic{height:90px}.sticker{right:14px;bottom:22px;font-size:26px}.doodle{right:18px}.music-card{right:8px;bottom:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="shell">
<header>
<p class="eyebrow">a tiny book of big feelings</p>
<h1 class="heading">For my Sarah ♡</h1>
<p class="sub">a little universe, made just for you 🎀</p>
</header>
<div class="toolbar">
<button class="btn primary" id="music" type="button">♫ Choose our song</button>
<label class="btn" for="allPhotos">♡ Add our photos</label>
<input id="allPhotos" type="file" accept="image/*" multiple hidden>
<button class="btn" id="confetti" type="button">✧ Sprinkle magic</button>
</div>
<p class="status" id="status" aria-live="polite">Choose an audio file once — it stays saved here until you change it ♡</p>
<section class="music-card" id="musicCard" aria-label="Anniversary song">
<div class="music-head"><strong id="songTitle">♫ Your little soundtrack</strong><button type="button" class="icon-btn" id="musicClose" aria-label="Hide player">×</button></div>
<audio id="songAudio" controls preload="metadata" loop></audio>
<div class="song-actions"><button class="btn small" type="button" id="changeSong">♡ Change song</button><button class="btn small" type="button" id="clearSong">Remove</button></div>
<input id="songFile" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac" hidden>
</section>
<div class="book-area" id="bookArea" aria-label="Sarah's diary, a cover and 11 pages"><div class="book" id="book"><div class="back-cover"></div></div></div>
<div class="progress" aria-hidden="true"><span id="bar"></span></div>
<div class="controls"><button class="btn" id="prev" type="button" disabled>← Previous</button><span class="counter" id="counter">Cover</span><button class="btn primary" id="next" type="button">Next page →</button></div>
<p class="hint">Tap the page, swipe, or use the ← → keys ♡</p>
<p class="footer">a little keepsake for Sarah · made with love, from Zaid ♡</p>
</main>
<script>
"use strict";
const pages=[
{label:"our first little page",title:"A Little Universe for Sarah",doodle:"🎀",sticker:"🧸",photo:true,text:"Sarah, welcome to this tiny corner of the world. This little book is a collection of sweet thoughts, small memories, and wishes made just for you. I hope every page brings a little smile.",note:"start here, this little book is yours ✧",caption:"the beginning of our little scrapbook ♡"},
{label:"a little introduction",title:"The One and Only Sarah",doodle:"🌷",sticker:"🎀",photo:true,text:"There is only one you, and that is what makes you special. Your little habits, your way of talking, your laughter, and all the things that make you who you are deserve to be celebrated.",note:"no edits needed — just be you",caption:"one person, a thousand lovely details"},
{label:"little everyday moments",title:"Small Things Matter",doodle:"☁️",sticker:"🐻",photo:true,text:"Sometimes the best memories are not grand plans. They are random conversations, silly jokes, unexpected smiles, and ordinary moments that somehow become favourites.",note:"the little things become the big memories",caption:"ordinary days, special memories"},
{label:"details worth keeping",title:"Things That Make You You",doodle:"✿",sticker:"🌸",photo:true,text:"Your expressions, your humour, your kindness, and the tiny details you might not even notice — they all make you wonderfully you. Never feel you need to be anyone else.",note:"your own kind of lovely ♡",caption:"a page for all the little details"},
{label:"memory corner",title:"A Moment to Remember",doodle:"📸",sticker:"🦋",photo:true,text:"Every photograph holds a little piece of time. Add a favourite picture here and let it remind you of a moment worth keeping close.",note:"tap a photo frame to add a picture",caption:"a memory tucked safely in a page"},
{label:"a little appreciation",title:"Thank You, Sarah",doodle:"💌",sticker:"💗",photo:true,text:"Thank you for being yourself, for the smiles you bring, and for all the small moments that can brighten an ordinary day. You deserve kindness, happiness, and people who appreciate you.",note:"this page is a little thank-you",caption:"you are appreciated more than you know"},
{label:"a wish for you",title:"For All Your Tomorrows",doodle:"☀️",sticker:"🌼",photo:false,text:"May your days be gentle, your dreams keep growing, and your hard work take you somewhere beautiful. May you always find reasons to be proud of yourself and people who cheer you on.",note:"wishing you a thousand happy tomorrows",caption:"a little wish, from the heart"},
{label:"more memories ahead",title:"The Story Isn't Finished",doodle:"✨",sticker:"🧸",photo:true,text:"There are still new memories to make, new stories to tell, more laughter to share, and so many ordinary days waiting to become special. This little book is only a beginning.",note:"the next pages are still unwritten",caption:"more moments waiting for their turn"},
{label:"one last reminder",title:"Never Forget This",doodle:"♡",sticker:"🎀",photo:false,text:"You matter. Your happiness matters. Your dreams matter. Even on days when things feel difficult, remember that you are worthy of patience, respect, and all the good things you are working towards.",note:"keep this reminder close ♡",caption:"a little note for any day"},
{label:"the last page, for now",title:"With Love, Zaid",doodle:"💗",sticker:"💐",photo:true,text:"And here we are at the last page. Ten pages cannot hold every thought or every memory, but I hope this tiny scrapbook makes you smile. The best moments are still ahead, and the next chapters are waiting to be written.",note:"the end of this book, not the memories ♡",caption:"made with love, especially for Sarah"},
 {label:"a day made for celebrating you",title:"Happy Birthday, Sarah!",doodle:"🦋",sticker:"🌸",photo:true,birthday:true,text:"Happy birthday to you, Sarah. May this new chapter bring gentle days, beautiful surprises, brave dreams, and countless little reasons to smile.",note:"A little page, just to celebrate you.",caption:"5th November 2010"}
];
const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.random()*(b-a),statusEl=$("status");
const say=msg=>statusEl.textContent=msg;
function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error("IndexedDB unavailable"));const req=indexedDB.open("SarahAnniversaryDiary",1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("song"))db.createObjectStore("song");if(!db.objectStoreNames.contains("photos"))db.createObjectStore("photos")};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function idb(store,mode,fn){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,mode),req=fn(tx.objectStore(store));tx.oncomplete=()=>{db.close();resolve(req?req.result:undefined)};tx.onerror=tx.onabort=()=>{db.close();reject(tx.error)}})}
async function shrink(file,max=900){try{const bmp=await createImageBitmap(file),r=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close?.();return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",.86))}catch{return file}}
const book=$("book"),sheets=[],photoSlots=[];let current=0;
function coverFace(){const f=document.createElement("div");f.className="face cover";f.innerHTML=`<div class="cover-top">✿ ✧ ♡ ✧ ✿</div><span class="cover-sticker l">🧸</span><span class="cover-sticker r">🦋</span><div><div class="cover-small">a little diary for</div><h2 class="cover-title">My Sarah</h2><div class="cover-small">${pages.length} pages · one little universe</div><div class="cover-flower">🌸 ♡ 🌷</div></div><div class="cover-bottom">made slowly, with love · Zaid</div>`;return f}
function backFace(){const f=document.createElement("div");f.className="face back";f.textContent="♡";return f}
function pageFace(p,n){
 const f=document.createElement("div");f.className="face";
 if(p.birthday){
  f.innerHTML=`<span class="birthday-flower one">🌷</span><span class="birthday-flower two">🌸</span><span class="tape"></span><span class="doodle">${p.doodle}</span><span class="sticker">${p.sticker}</span><div class="inner birthday-page"><p class="birthday-kicker">a little celebration, made with love</p><h2 class="birthday-heading">Happy Birthday, Sarah!</h2><div class="birthday-date">5th November 2010</div><p class="birthday-ornament">✿ ♡ ✧ 🦋 ✧ ♡ ✿</p><label class="birthday-photo"><span class="birthday-photo-inner"><img alt="Sarah's birthday memory"><span class="ph">♡ Add a favourite birthday photo here ♡<br><small>tap the frame to add or change</small></span><span class="photo-sparkle">✧</span></span><input type="file" accept="image/*" hidden></label><div class="birthday-message"><strong>A wish, just for you</strong>${p.text}</div><p class="birthday-bottom">A little page, just to celebrate you.</p><span class="pagenum">♡ ${n} / ${pages.length} ♡</span></div>`;
 }else{
  f.innerHTML=`<span class="tape"></span><span class="doodle">${p.doodle}</span><span class="sticker">${p.sticker}</span><div class="inner"><div class="label"></div><h2 class="title"></h2><p class="text"></p><div class="caption"><span class="cap-text"></span><span>♡ ✧ 🎀</span></div>${p.photo?`<label class="polaroid"><span class="pic"><img alt="A memory"><span class="ph">♡ add a photo ♡</span></span><small>tap to add / change</small><input type="file" accept="image/*" hidden></label>`:""}<p class="note"></p><span class="pagenum">♡ ${n} / ${pages.length} ♡</span></div>`;
  f.querySelector(".label").textContent=p.label;f.querySelector(".title").textContent=p.title;f.querySelector(".text").textContent=p.text;f.querySelector(".cap-text").textContent=p.caption;f.querySelector(".note").textContent=p.note;
 }
 if(p.photo){
  const img=f.querySelector("img"),ph=f.querySelector(".ph"),input=f.querySelector('input[type="file"]'),slotIndex=photoSlots.length;
  const slot={
  key:"photo"+slotIndex,
  url:null,
  show(blob){
    if(slot.url)URL.revokeObjectURL(slot.url);
    slot.url=URL.createObjectURL(blob);
    img.src=slot.url;
    img.style.display="block";
    ph.style.display="none";
  },
  showRemote(src){
    if(slot.url)URL.revokeObjectURL(slot.url);
    slot.url=null;
    img.src=src;
    img.style.display="block";
    ph.style.display="none";
  },
  async set(file){
    const blob=await shrink(file);
    slot.show(blob);
    try{
      await idb("photos","readwrite",s=>s.put(blob,slot.key));
    }catch(e){console.error(e)}
  }
};
  input.addEventListener("change",()=>{
  const file=input.files?.[0];
  input.value="";
  if(file&&file.type.startsWith("image/"))slot.set(file);
});

photoSlots.push(slot);
 }
 return f
}
function addSheet(front,back,z){const s=document.createElement("div");s.className="page";s.style.zIndex=z;s.append(front,back);book.appendChild(s);sheets.push(s)}
addSheet(coverFace(),backFace(),pages.length+1);pages.forEach((p,i)=>addSheet(pageFace(p,i+1),backFace(),pages.length-i));
 
const hostedPhotos = [
  "Sarah1.jpg",
  "Sarah2.jpg",
  "Sarah3.jpg",
  "Sarah4.jpg",
  "Sarah5.jpg",
  "Sarah6.jpg",
  "Sarah8.jpg",
  "Sarah10.jpg",
  "Sarah11.jpg"
];

photoSlots.forEach((slot, i) => {
  slot.showRemote("images/" + hostedPhotos[i]);
});

const total=sheets.length,counter=$("counter"),prev=$("prev"),next=$("next"),bar=$("bar");
function update(){sheets.forEach((s,i)=>{s.classList.toggle("flipped",i<current);s.classList.toggle("is-active",i===current);s.classList.toggle("far",i<current-1||i>current+1)});counter.textContent=current===0?"Cover":`Page ${current} / ${pages.length}`;prev.disabled=current===0;next.disabled=current>=total-1;bar.style.transform=`scaleX(${current/(total-1)})`}
function go(d){const n=current+d;if(n<0||n>total-1)return;current=n;update()}
next.addEventListener("click",()=>go(1));prev.addEventListener("click",()=>go(-1));
sheets.forEach((s,i)=>s.addEventListener("click",e=>{if(i!==current||e.target.closest("label,input,button"))return;const r=s.getBoundingClientRect();go(e.clientX-r.left<r.width*.18&&current>0?-1:1)}));
document.addEventListener("keydown",e=>{if(e.target.closest?.("audio,input"))return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let startX=null;const area=$("bookArea");area.addEventListener("touchstart",e=>{startX=e.touches[0].clientX},{passive:true});area.addEventListener("touchend",e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;startX=null;if(Math.abs(dx)>60)go(dx<0?1:-1)},{passive:true});update();
$("allPhotos").addEventListener("change",async e=>{const files=[...(e.target.files||[])].filter(f=>f.type.startsWith("image/"));e.target.value="";if(!files.length)return say("Choose photos to make this diary yours ♡");const n=Math.min(files.length,photoSlots.length);say("Tucking your photos in… ♡");for(let i=0;i<n;i++)await photoSlots[i].set(files[i]);say(`${n} photo(s) tucked into your diary ♡ saved in this browser`+(files.length>n?` · only the first ${n} fit`:""))});
(async()=>{for(const slot of photoSlots){try{const blob=await idb("photos","readonly",s=>s.get(slot.key));if(blob)slot.show(blob)}catch(e){console.error(e)}}})();
const musicBtn = $("music");
const musicCard = $("musicCard");
const audio = $("songAudio");
const songTitle = $("songTitle");
const songFile = $("songFile");
let songUrl = null;

// The top button only opens the player.
// Playback is controlled by the audio player's own Play/Pause button.
musicBtn.addEventListener("click", () => {
  musicCard.classList.add("show");
});

$("musicClose").addEventListener("click", () => {
  musicCard.classList.remove("show");
});

function setSong(blob, name) {
  if (songUrl) URL.revokeObjectURL(songUrl);
  songUrl = URL.createObjectURL(blob);
  audio.src = songUrl;
  songTitle.textContent = (name || "Our song").replace(/\.[^.]+$/, "");
  audio.load();
}

$("changeSong").addEventListener("click", () => songFile.click());

songFile.addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;

  if (!file.type.startsWith("audio/") &&
      !/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(file.name)) {
    say("Please choose an audio file ♡");
    songFile.value = "";
    return;
  }

  try {
    await idb("song", "readwrite", store =>
      store.put({ blob: file, name: file.name }, "chosen")
    );
    setSong(file, file.name);
    say("Your song is ready ♡ Tap Play to listen.");
  } catch (err) {
    console.error(err);
    say("Could not save your song ♡");
  }
  songFile.value = "";
});

$("clearSong").addEventListener("click", async () => {
  audio.pause();
  if (songUrl) {
    URL.revokeObjectURL(songUrl);
    songUrl = null;
  }
  songTitle.textContent = "♫ Your little soundtrack";
  audio.src = "./birthday-song.mp3";
  audio.load();

  try {
    await idb("song", "readwrite", store => store.delete("chosen"));
    say("Song removed. Back to the birthday song ♡");
  } catch (err) {
    console.error(err);
    say("Song reset, but saved copy could not be removed ♡");
  }
});

audio.addEventListener("play", () => say("Your song is playing ♡"));
audio.addEventListener("pause", () => {
  if (!audio.ended && audio.currentSrc) say("Song paused ♡");
});
audio.addEventListener("error", () => {
  say("Could not load the song. Check birthday-song.mp3 or choose another ♡");
});

(async () => {
  try {
    const saved = await idb("song", "readonly", store => store.get("chosen"));
    if (saved?.blob) {
      setSong(saved.blob, saved.name);
      say("Your saved song is still here ♡");
    } else {
      audio.src = "./birthday-song.mp3";
      audio.load();
    }
  } catch (err) {
    console.error(err);
    audio.src = "./birthday-song.mp3";
    audio.load();
  }
})();
$("confetti").addEventListener("click",()=>{const syms=["♡","✧","🌸","🎀","💗","⭐","🦋","🌷"],frag=document.createDocumentFragment();for(let i=0;i<22;i++){const el=document.createElement("span");el.textContent=syms[Math.random()*syms.length|0];el.style.cssText=`position:fixed;z-index:30;left:${rand(5,95)}vw;top:${rand(35,80)}vh;font-size:${rand(17,36)}px;pointer-events:none;will-change:transform,opacity`;frag.appendChild(el);el.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${rand(-80,80)}px,${rand(-300,-140)}px) rotate(${rand(-180,180)}deg)`,opacity:0}],{duration:1600,easing:"ease-out",fill:"forwards"}).onfinish=()=>el.remove()}document.body.appendChild(frag);say("A little shower of magic, just for you ✨")});
(function particles(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cv=$("fx"),ctx=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);let W=0,H=0;function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener("resize",resize);

const k=W<600?.6:1,hearts=["♡","✧","✿","♥","❀"].map((ch,i)=>glyph(ch,24,["#d58aa6","#e7a6bf","#c7829e","#dd8fae","#e6a9c0"][i])),petals=["🌸","🌷"].map(ch=>glyph(ch,22,"#000")),fly=glow(),bfly=glyph("🦋",26,"#000"),ps=[];
for(let i=0;i<16*k;i++)ps.push({t:"up",s:hearts[i%hearts.length],x:rand(0,W),y:rand(0,H),v:rand(-40,-18),amp:rand(10,28),ph:rand(0,6.28),sw:rand(.4,1),sc:rand(.5,1.1),a:rand(.45,.8),r:rand(-.4,.4)});
for(let i=0;i<9*k;i++)ps.push({t:"down",s:petals[i%2],x:rand(0,W),y:rand(0,H),v:rand(22,48),amp:rand(18,40),ph:rand(0,6.28),sw:rand(.3,.7),sc:rand(.55,1),a:rand(.55,.85),r:rand(0,6)});
for(let i=0;i<14*k;i++)ps.push({t:"fly",s:fly,x:rand(0,W),y:rand(0,H),v:rand(-6,6),amp:rand(6,16),ph:rand(0,6.28),sw:rand(.5,1.4),sc:rand(.5,1)});
for(let i=0;i<3;i++)ps.push({t:"bf",s:bfly,x:rand(-40,W),y:rand(60,H-60),v:rand(26,46),amp:rand(18,34),ph:rand(0,6.28),sw:rand(.8,1.4),sc:rand(.8,1.1)});
ps.forEach(p=>{p.y0=p.y;p.x0=p.x});let last=0,raf=0,time=0;
function frame(now){raf=requestAnimationFrame(frame);const dt=Math.min((now-last)/1000||0,.05);last=now;time+=dt;ctx.clearRect(0,0,W,H);for(const p of ps){let a=1,rot=0,x=p.x,y=p.y;if(p.t==="up"||p.t==="down"){p.y+=p.v*dt;if(p.y< -40)p.y=H+40;if(p.y>H+40)p.y=-40;x=p.x0+Math.sin(time*p.sw+p.ph)*p.amp;y=p.y;a=p.a*Math.sin(Math.PI*Math.min(1,Math.max(0,(y+40)/(H+80))));rot=p.t==="down"?p.r+time*.4:p.r+Math.sin(time*p.sw+p.ph)*.3}else if(p.t==="fly"){x=p.x+Math.sin(time*p.sw+p.ph)*p.amp;y=p.y+Math.cos(time*p.sw*.8+p.ph)*p.amp;a=.15+.85*(.5+.5*Math.sin(time*p.sw*2+p.ph))}else{p.x+=p.v*dt;if(p.x>W+40)p.x=-40;x=p.x;y=p.y0+Math.sin(time*p.sw+p.ph)*p.amp;rot=Math.sin(time*p.sw*2+p.ph)*.25;a=.85}if(a<=.01)continue;const w=p.s.size*p.sc;ctx.globalAlpha=a;if(rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(p.s,-w/2,-w/2,w,w);ctx.restore()}else ctx.drawImage(p.s,x-w/2,y-w/2,w,w)}ctx.globalAlpha=1}
